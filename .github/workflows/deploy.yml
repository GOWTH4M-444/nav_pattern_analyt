name: Build, Test & Deploy React Frontend

on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gate: Node Setup, Linting, Unit Tests & PySpark Syntax Check
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript linting (tsc --noEmit)
        run: npm run lint

      - name: Run frontend & analytics unit test suite
        run: npm test

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate PySpark, Delta Lake & Matplotlib backend scripts
        run: |
          python3 -m py_compile \
            scripts/big_data_pipeline.py \
            scripts/spark_structured_streaming.py \
            scripts/pyspark_navigation_analysis.py \
            scripts/pyspark_anomaly_detection.py \
            scripts/data_quality_validation.py \
            scripts/matplotlib_analytics_charts.py

  # ---------------------------------------------------------------------------
  # 2. Production Build & Artifact Generation
  # ---------------------------------------------------------------------------
  build:
    name: Build Production Bundle
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production React bundle (Vite)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify production build output (dist/)
        run: |
          test -f dist/index.html
          ls -la dist/
          ls -la dist/assets/

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: navpattern-studio-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages deployment artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ---------------------------------------------------------------------------
  # 3. Automated Production Deployment
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy production artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
