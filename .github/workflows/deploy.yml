name: NavPattern Studio CI/CD — Build, Test & Deploy

on:
  push:
    branches:
      - main
      - master
      - release/*
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PYTHON_VERSION: '3.11'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  # ===========================================================================
  # STAGE 1: Quality Gate & Testing (Lint, Unit Tests & PySpark Syntax Check)
  # ===========================================================================
  quality-gate-and-test:
    name: Stage 1 — Quality Gate & Testing
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }} with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type-checking (npm run lint)
        run: npm run lint

      - name: Execute unit test suites (navigationMining, sessionReplay, enterpriseBigData, gestures)
        run: |
          npx tsx --test \
            src/utils/navigationMining.test.ts \
            src/utils/sessionReplay.test.ts \
            src/utils/enterpriseBigData.test.ts \
            src/utils/gestures.test.ts

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Python bytecode syntax across PySpark, Delta Lake, Kafka & Matplotlib scripts
        run: |
          python3 -m py_compile \
            scripts/big_data_pipeline.py \
            scripts/spark_structured_streaming.py \
            scripts/pyspark_navigation_analysis.py \
            scripts/pyspark_anomaly_detection.py \
            scripts/data_quality_validation.py \
            scripts/matplotlib_analytics_charts.py

  # ===========================================================================
  # STAGE 2: Production Build & Artifact Generation
  # ===========================================================================
  production-build:
    name: Stage 2 — Production Vite Build
    needs: quality-gate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }} with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci --legacy-peer-deps

      - name: Compile production Vite bundle
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify dist/index.html generation and bundle assets
        run: |
          test -f dist/index.html
          ls -la dist/
          ls -la dist/assets/

      - name: Upload versioned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: navpattern-studio-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ===========================================================================
  # STAGE 3: Automated Production Deployment & Webhook Trigger
  # ===========================================================================
  automated-deployment:
    name: Stage 3 — Automated Deployment
    needs: production-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified production bundle to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger downstream deployment webhook (if configured)
        if: env.DEPLOY_WEBHOOK_URL != ''
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\",\"status\":\"deployed\"}"
