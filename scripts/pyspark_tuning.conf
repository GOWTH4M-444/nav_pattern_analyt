# ==============================================================================
# NavPattern Studio — Production Apache Spark & OpenJDK 17 Performance Tuning
# File: scripts/pyspark_tuning.conf
# Usage: spark-submit --properties-file scripts/pyspark_tuning.conf scripts/big_data_pipeline.py
# ==============================================================================

# 1. Kryo Serialization & Buffer Tuning
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max                   512m
spark.kryoserializer.buffer                       64m
spark.rdd.compress                                true

# 2. Adaptive Query Execution (AQE) & Dynamic Shuffle Partitioning
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.coalescePartitions.minPartitionSize  64MB
spark.sql.adaptive.advisoryPartitionSizeInBytes   128MB
spark.sql.adaptive.skewJoin.enabled               true
spark.sql.adaptive.skewJoin.skewedPartitionFactor 5
spark.sql.shuffle.partitions                      200

# 3. Project Tungsten Off-Heap Memory & Garbage Collection (OpenJDK 17 G1GC)
spark.memory.offHeap.enabled                      true
spark.memory.offHeap.size                         8g
spark.memory.fraction                             0.75
spark.memory.storageFraction                      0.30
spark.executor.extraJavaOptions                   -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=35 -XX:ConcGCThreads=4 -XX:+ParallelRefProcEnabled
spark.driver.extraJavaOptions                     -XX:+UseG1GC -Djava.net.preferIPv4Stack=true

# 4. Broadcast Join Thresholds & Catalyst Optimizer Rules
spark.sql.autoBroadcastJoinThreshold              104857600
spark.sql.broadcastTimeout                        600
spark.sql.cbo.enabled                             true
spark.sql.cbo.joinReorder.enabled                 true

# 5. Delta Lake & Parquet Vectorized Reader Optimization
spark.sql.parquet.enableVectorizedReader          true
spark.databricks.delta.optimizeWrite.enabled      true
spark.databricks.delta.autoCompact.enabled        true
spark.databricks.delta.properties.defaults.enableChangeDataFeed true
